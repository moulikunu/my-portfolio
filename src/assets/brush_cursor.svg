    d="M 1.5 1.5 L 12.5 30 L 16.5 21 L 25.5 27 L 28.5 22 L 19.5 16.5 L 27.5 12.5 Z"
    stroke="rgba(255, 255, 255, 0.85)"
    stroke-width="1.8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Main solid deep-black hand-painted brush body -->
  <path
    d="M 1.5 1.5 Q 4 8.5 7 16.5 Q 10 23.5 12.5 30 Q 14 26.5 16.5 21 Q 20.5 23.5 25.5 27 Q 27 24.5 28.5 22 Q 23.5 19.5 19.5 16.5 Q 23.5 14.5 27.5 12.5 Q 19.5 8.5 10.5 4.5 Z"
    fill="#050505"
  />

  <!-- Organic ink bristle textures & brush streaks -->
  <path d="M 2.5 3.5 Q 5.5 11 9.5 18.5 Q 12 16.5 15 19.5" stroke="#1A1816" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 4.5 6.5 Q 8.5 13.5 13.5 18" stroke="#25221F" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round" />
  <path d="M 7.5 9.5 L 18 15" stroke="#181614" stroke-width="0.7" stroke-linecap="round" />
  <path d="M 1.5 1.5 L 9 5.5 L 4.5 11 Z" fill="#000000" />

  <!-- Splattered dry-brush ink flecks -->
  <circle cx="28" cy="29" r="0.75" fill="#050505" stroke="rgba(255, 255, 255, 0.6)" stroke-width="0.3" />
  <circle cx="30.5" cy="24.5" r="0.5" fill="#050505" stroke="rgba(255, 255, 255, 0.6)" stroke-width="0.3" />
  <circle cx="13.5" cy="32" r="0.6" fill="#050505" stroke="rgba(255, 255, 255, 0.6)" stroke-width="0.3" />
  <circle cx="2.5" cy="18" r="0.4" fill="#050505" stroke="rgba(255, 255, 255, 0.6)" stroke-width="0.3" />
</svg>
